      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    @keyframes bounceJoy {
      0%, 100% { transform: translateY(0) rotate(-5deg) scale(1); }
      35% { transform: translateY(-22px) rotate(6deg) scale(1.06); }
      65% { transform: translateY(-10px) rotate(-3deg) scale(0.98); }
    }
    @keyframes tremblePanic {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-5px, -3px) rotate(-4deg); }
      40% { transform: translate(5px, 2px) rotate(4deg); }
      60% { transform: translate(-3px, 3px) rotate(-3deg); }
      80% { transform: translate(3px, -2px) rotate(3deg); }

    @keyframes soulFloat {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0.75; }
      50% { transform: translateY(-34px) translateX(6px); opacity: 1; }
    }
    @keyframes twinklePulse {

    }

      75% { opacity: 1; transform: translateY(-28px) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(0.8); }
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }

    .anim-float { animation: gentleFloat 3.2s ease-in-out infinite; }
    .anim-happy { animation: bounceJoy 1.25s ease-in-out infinite; }
    .anim-shocked { animation: tremblePanic 0.45s linear infinite; }

    .anim-delta { animation: floatDelta 1.4s ease-out forwards; }
    .anim-modal { animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    // ==========================================
    // 1. WEB AUDIO SOUND EFFECTS

    class SoundManager {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playClick() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }
      playMove() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(560, now + 0.2);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      playOxygenGain() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [440, 554, 659, 880].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = now + idx * 0.07;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.15);
        });
      }
      playDanger() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.setValueAtTime(200, now + 0.1);
        osc.frequency.setValueAtTime(160, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }
      playSuccessDNA() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = now + idx * 0.1;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.25);
        });
      }
      playVictory() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [
          { f: 523.25, d: 0.15 },
          { f: 659.25, d: 0.15 },
          { f: 783.99, d: 0.15 },
          { f: 1046.5, d: 0.4 },
        ];
        let offset = 0;
        notes.forEach((note) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = now + offset;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(note.f, t);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + note.d);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + note.d);
          offset += note.d * 0.8;
        });
      }
      playDefeat() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [440, 415, 392, 349].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = now + idx * 0.2;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.3);
        });
      }

    function generatePlanetName(existingNames) {
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let name = '';
      do {
        const l1 = letters[Math.floor(Math.random() * letters.length)];
        const l2 = letters[Math.floor(Math.random() * letters.length)];
        const num = Math.floor(100 + Math.random() * 900);
        name = `${l1}${l2}-${num}`;
      } while (existingNames.has(name));
      existingNames.add(name);
      return name;
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initializePlanets() {
      const eventPool = [
        { event: 'none' }, { event: 'none' }, { event: 'none' }, { event: 'none' },
        { event: 'oxygen', oxygenBonus: Math.random() < 0.5 ? 2 : 3 },
        { event: 'oxygen', oxygenBonus: Math.random() < 0.5 ? 2 : 3 },
        { event: 'oxygen', oxygenBonus: Math.random() < 0.5 ? 2 : 3 },
        { event: 'oxygen', oxygenBonus: Math.random() < 0.5 ? 2 : 3 },
        { event: 'volcano' }, { event: 'volcano' },
        { event: 'plant' },
        { event: 'cute_animal' }, { event: 'cute_animal' },
        { event: 'wild_animal' }, { event: 'wild_animal' },
        { event: 'gravity_repel' }, { event: 'gravity_repel' },
      ];

      const shuffledEvents = shuffleArray(eventPool);
      const usedNames = new Set();

      return FIXED_PLANET_LAYOUT.map((layoutItem, index) => {
        if (layoutItem.isEarth) {
          return {
            id: layoutItem.id,
            name: '地球',
            isEarth: true,
            x: layoutItem.x,
            y: layoutItem.y,
            themeColor: layoutItem.themeColor,
            ring: layoutItem.ring,
            event: 'none',
            visited: true,
          };
        }
        const eventItem = shuffledEvents[index - 1];
        const name = generatePlanetName(usedNames);
        return {
          id: layoutItem.id,
          name,
          isEarth: false,
          x: layoutItem.x,
          y: layoutItem.y,
          themeColor: layoutItem.themeColor,
          ring: layoutItem.ring,
          event: eventItem.event,
          oxygenBonus: eventItem.oxygenBonus,
          visited: false,
        };
      });
    }

    function findNearestUnvisitedAlienPlanet(currentPlanetId, allPlanets, visitedIds) {
      const current = allPlanets.find((p) => p.id === currentPlanetId);
      if (!current) return null;
      const candidates = allPlanets.filter((p) => !p.isEarth && p.id !== currentPlanetId && !visitedIds.includes(p.id));
      if (candidates.length === 0) return allPlanets.find((p) => p.isEarth) || null;

      let nearest = candidates[0];
      let minDistanceSq = Number.MAX_VALUE;
      for (const candidate of candidates) {
        const dx = candidate.x - current.x;
        const dy = candidate.y - current.y;
        const distSq = dx * dx + dy * dy;
        if (distSq < minDistanceSq) {
          minDistanceSq = distSq;
          nearest = candidate;
        }
      }
      return nearest;
    }

    // ==========================================
    // 9. MAIN GAMEPLAY SCREEN COMPONENT
    // ==========================================
    const MainGameScreen = ({ mission, audioEnabled, onToggleAudio, onRestartGame, onVictory, onGameOver }) => {
      const [planets, setPlanets] = useState(() => initializePlanets());
      const [playerLocation, setPlayerLocation] = useState('earth');
      const [oxygen, setOxygen] = useState(7);
      const [visitedPlanets, setVisitedPlanets] = useState([]);
      const [plantDNA, setPlantDNA] = useState(false);
      const [animalDNA, setAnimalDNA] = useState(false);
      const [astronautExpression, setAstronautExpression] = useState('normal');
      const [latestEventMessage, setLatestEventMessage] = useState('太空船已就緒，請點選有光暈的外星星球開始探索！');
      const [eventLogs, setEventLogs] = useState([]);
      const [isProcessingMove, setIsProcessingMove] = useState(false);
      const [oxygenDeltaAnim, setOxygenDeltaAnim] = useState(null);
      const [mobileTab, setMobileTab] = useState('map');

      const currentPlanet = planets.find((p) => p.id === playerLocation) || planets[0];
      const exploredCount = visitedPlanets.length;

      const isMissionGoalAchieved =
        mission === 'plant' ? plantDNA : mission === 'animal' ? animalDNA : exploredCount >= 10;

      const triggerDeltaAnimation = (val) => {
        setOxygenDeltaAnim({ value: val, id: Date.now() });
        setTimeout(() => setOxygenDeltaAnim(null), 1400);
      };

      const handlePlanetClick = (targetPlanet) => {
        if (isProcessingMove || targetPlanet.id === playerLocation) return;
        if (!targetPlanet.isEarth && visitedPlanets.includes(targetPlanet.id)) return;

        setIsProcessingMove(true);
        sounds.playMove();

        // 1. Move cost 1 oxygen
        const newOxygen = oxygen - 1;
        triggerDeltaAnimation(-1);

        if (newOxygen <= 0) {
          setOxygen(0);
          sounds.playDefeat();
          onGameOver(exploredCount, '在航向星球途中氧氣完全耗盡，無法繼續航行。');
          setIsProcessingMove(false);
          return;
        }

        setOxygen(newOxygen);
        setPlayerLocation(targetPlanet.id);

        // Returning to Earth check
        if (targetPlanet.isEarth) {
          if (isMissionGoalAchieved) {
            setAstronautExpression('happy');
            setLatestEventMessage('太棒了！你帶著珍貴的探索成果平安降落地球母星！');
            setTimeout(() => {
              onVictory(newOxygen, exploredCount);
            }, 600);
          } else {
            setAstronautExpression('normal');
            setLatestEventMessage('回到地球補給站！目前的任務目標尚未完成，請繼續探索外星！');
            setIsProcessingMove(false);
          }
          return;
        }

        // Alien Planet Visit
        const newVisited = [...visitedPlanets, targetPlanet.id];
        setVisitedPlanets(newVisited);
        setPlanets((prev) => prev.map((p) => (p.id === targetPlanet.id ? { ...p, visited: true } : p)));

        // Event Trigger
        setTimeout(() => {
          resolvePlanetEvent(targetPlanet, newOxygen, newVisited);
        }, 350);
      };

      const resolvePlanetEvent = (targetPlanet, currentOx, updatedVisited) => {
        let nextOxygen = currentOx;
        let expression = 'normal';
        let eventSummary = '';

        switch (targetPlanet.event) {
          case 'none':
            expression = 'normal';
            eventSummary = `抵達星球 ${targetPlanet.name}：這是一顆寂靜的荒涼死星，四處空無一物，無事發生。`;
            sounds.playClick();
            break;

          case 'oxygen': {
            const gain = targetPlanet.oxygenBonus || 2;
            nextOxygen = currentOx + gain;
            triggerDeltaAnimation(gain);
            expression = 'happy';
            eventSummary = `抵達星球 ${targetPlanet.name}：幸運發現了外星能量水晶與高濃度氧氣泉！獲得 +${gain} 個氧氣罐！`;
            sounds.playOxygenGain();
            break;
          }

          case 'volcano':
            nextOxygen = currentOx - 2;
            triggerDeltaAnimation(-2);
            expression = 'shocked';
            eventSummary = `危險！星球 ${targetPlanet.name} 突然發生劇烈火山噴發！高溫岩漿損壞了裝備，損失 -2 個氧氣罐！`;
            sounds.playDanger();
            break;

          case 'plant':
            setPlantDNA(true);
            expression = 'happy';
            eventSummary = `重大發現！在星球 ${targetPlanet.name} 採集到了極度珍貴的「外星植物生命 DNA 樣本」！`;
            sounds.playSuccessDNA();
            break;

          case 'cute_animal':
            setAnimalDNA(true);
            expression = 'happy';
            eventSummary = `遇見驚喜！星球 ${targetPlanet.name} 住著溫馴可愛的外星生物，順利取得「外星動物生命 DNA 樣本」！`;
            sounds.playSuccessDNA();
            break;

          case 'wild_animal':
            nextOxygen = currentOx - 1;
            triggerDeltaAnimation(-1);
            setAnimalDNA(true);
            expression = 'shocked';
            eventSummary = `遇險！在星球 ${targetPlanet.name} 遭到兇暴外星猛獸襲擊！雖然採集到動物 DNA，但緊急撤離時消耗了 -1 個氧氣罐！`;
            sounds.playDanger();
            break;

          case 'gravity_repel': {
            nextOxygen = currentOx - 1;
            triggerDeltaAnimation(-1);
            expression = 'shocked';
            sounds.playDanger();
            const nearestPlanet = findNearestUnvisitedAlienPlanet(targetPlanet.id, planets, updatedVisited);
            eventSummary = `引力異常！星球 ${targetPlanet.name} 產生強烈反重力排斥，太空船失控被彈飛至鄰近星球 ${nearestPlanet ? nearestPlanet.name : '未知星域'}，額外消耗 -1 個氧氣罐！`;

            if (nearestPlanet) {
              setPlayerLocation(nearestPlanet.id);
              if (!nearestPlanet.isEarth) {
                updatedVisited = [...updatedVisited, nearestPlanet.id];
                setVisitedPlanets(updatedVisited);
                setPlanets((prev) => prev.map((p) => (p.id === nearestPlanet.id ? { ...p, visited: true } : p)));
              }
            }
            break;
          }
        }

        setOxygen(nextOxygen);
        setAstronautExpression(expression);
        setLatestEventMessage(eventSummary);
        setEventLogs((prev) => [
          {
            id: Date.now(),
            planetName: targetPlanet.name,
            eventType: targetPlanet.event,
            message: eventSummary,
          },
          ...prev.slice(0, 5),
        ]);

        if (nextOxygen <= 0) {
          sounds.playDefeat();
          setTimeout(() => {
            onGameOver(updatedVisited.length, '在探索星球時氧氣耗盡，無法安全返回地球。');
          }, 600);
        } else {
          setIsProcessingMove(false);
        }
      };

      const getMissionTitle = () => {
        switch (mission) {
          case 'plant': return '取得植物 DNA 樣本並回地球';
          case 'animal': return '取得動物 DNA 樣本並回地球';
          case 'explore10': return '探索 10 顆星球並回地球';
        }
      };

      return (
        <div id="main-game-screen" className="relative min-h-screen w-full flex flex-col justify-between bg-slate-950 text-white overflow-hidden">
          {/* HEADER */}
          <header className="w-full bg-slate-900/90 border-b border-slate-800 px-3 sm:px-6 py-2.5 z-20 flex flex-wrap items-center justify-between gap-2 shadow-md">
            <div className="flex items-center gap-2">
              <div className="w-7 h-7 rounded-lg bg-cyan-500/20 border border-cyan-400/50 flex items-center justify-center">
                <Icon name="globe2" className="w-4 h-4 text-cyan-400" />
              </div>
              <h1 className="text-sm sm:text-base font-black text-white tracking-wide">星球大探索</h1>
            </div>

            <div className="flex items-center gap-2.5 px-3.5 py-1.5 rounded-2xl bg-slate-800/90 border border-slate-700">
              <span className="text-xs font-semibold text-slate-400">任務:</span>
              <span className="text-xs sm:text-sm font-black text-slate-100">{getMissionTitle()}</span>
              {isMissionGoalAchieved ? (
                <span className="text-xs bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded border border-emerald-500/40 animate-pulse font-black">
                  達成！請回地球
                </span>
              ) : (
                <span className="text-xs text-amber-300 font-bold">進行中</span>
              )}
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={onToggleAudio}
                className="p-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-colors cursor-pointer"
                title={audioEnabled ? '關閉音效' : '開啟音效'}
              >
                <Icon name={audioEnabled ? 'volume2' : 'volumeX'} className="w-4 h-4 text-cyan-400" />
              </button>
              <button
                onClick={() => { sounds.playClick(); onRestartGame(); }}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-xs font-semibold text-slate-300 border border-slate-700 cursor-pointer"
              >
                <Icon name="rotateCcw" className="w-3.5 h-3.5" />
                <span className="hidden sm:inline">重新開始</span>
              </button>
            </div>
          </header>

          {/* SECONDARY INFO STRIP */}
          <div className="w-full bg-slate-900/60 border-b border-slate-800 px-4 py-1.5 z-10 flex flex-wrap items-center justify-between text-xs text-slate-300 gap-2">
            <div className="flex items-center gap-3">
              <span className="flex items-center gap-1">
                <Icon name="mapPin" className="w-3.5 h-3.5 text-cyan-400" />
                <span>已探索外星: <strong className="text-cyan-300">{exploredCount}</strong> / 17</span>
              </span>
              <span>•</span>
              <span className="flex items-center gap-1">
                <Icon name="leaf" className="w-3.5 h-3.5 text-emerald-400" />
                <span>植物 DNA: {plantDNA ? <strong className="text-emerald-400">已取得</strong> : '未尋獲'}</span>
              </span>
              <span>•</span>
              <span className="flex items-center gap-1">
                <Icon name="paw" className="w-3.5 h-3.5 text-amber-400" />
                <span>動物 DNA: {animalDNA ? <strong className="text-amber-400">已取得</strong> : '未尋獲'}</span>
              </span>
            </div>

            <div className="sm:hidden flex items-center bg-slate-800 rounded-lg p-0.5 border border-slate-700">
              <button
                onClick={() => setMobileTab('map')}
                className={`px-2 py-0.5 rounded text-[11px] font-bold ${mobileTab === 'map' ? 'bg-cyan-600 text-white' : 'text-slate-400'}`}
              >
                宇宙星圖
              </button>
              <button
                onClick={() => setMobileTab('list')}
                className={`px-2 py-0.5 rounded text-[11px] font-bold ${mobileTab === 'list' ? 'bg-cyan-600 text-white' : 'text-slate-400'}`}
              >
                星球清單 ({planets.length})
              </button>
            </div>
          </div>

          {/* STAR MAP AREA */}
          <main className="relative flex-1 w-full max-w-6xl mx-auto flex flex-col items-center justify-center p-2 sm:p-4 z-10 overflow-hidden min-h-[480px]">
            <div
              id="star-map-container"
              className={`relative w-full h-[480px] sm:h-[550px] md:h-[600px] rounded-3xl border border-slate-800/90 bg-gradient-to-b from-slate-950 via-slate-900 to-indigo-950/80 shadow-2xl overflow-hidden transition-all ${
                mobileTab === 'map' ? 'block' : 'hidden sm:block'
              }`}
            >
              {/* Twinkling Stars */}
              <div className="absolute inset-0 pointer-events-none overflow-hidden">
                {TWINKLING_STARS.map((s) => (
                  <div
                    key={s.id}
                    className="absolute rounded-full"
                    style={{
                      left: `${s.x}%`,
                      top: `${s.y}%`,
                      width: `${s.size}px`,
                      height: `${s.size}px`,
                      backgroundColor: s.color,
                      animation: `twinklePulse ${s.dur}s ease-in-out infinite ${s.delay}s`,
                    }}
                  />
                ))}
              </div>

              {/* 18 Planets */}
              {planets.map((p) => {
                const isCurrent = p.id === playerLocation;
                const canClick = !isCurrent && (p.isEarth || !visitedPlanets.includes(p.id));
                return (
                  <PlanetGraphic
                    key={p.id}
                    planet={p}
                    isCurrent={isCurrent}
                    canClick={canClick && !isProcessingMove}
                    onClick={() => handlePlanetClick(p)}
                  />
                );
              })}

              {/* Astronaut Marker */}
              <div
                id="astronaut-marker"
                className="absolute z-20 pointer-events-none -translate-x-1/2 -translate-y-1/2 transition-all duration-500 ease-out"
                style={{
                  left: `${currentPlanet.x}%`,
                  top: `${currentPlanet.y - (currentPlanet.isEarth ? 9.5 : 8)}%`,
                }}
              >
                <div className="flex flex-col items-center">
                  <CuteAstronaut expression={astronautExpression} size="sm" floating={!isProcessingMove} />
                  <span className="text-xs font-black text-cyan-300 bg-slate-900/95 px-2 py-0.5 rounded-full border border-cyan-400 shadow-md -mt-1">
                    太空人
                  </span>
                </div>
              </div>

              {/* Floating Oxygen Gauge in Map */}
              <div className="absolute bottom-3 right-3 z-30 pointer-events-auto">
                <OxygenGauge oxygen={oxygen} deltaAnimation={oxygenDeltaAnim} />
              </div>

              <div className="absolute top-3 left-3 z-20 hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-900/80 border border-slate-700/80 text-[11px] text-slate-300">
                <Icon name="sparkles" className="w-3.5 h-3.5 text-yellow-300" />
                <span>點擊光暈閃爍星球即可出發</span>
              </div>
            </div>

            {/* Mobile List View */}
            <div
              id="mobile-planet-roster"
              className={`w-full max-h-[460px] overflow-y-auto p-2 bg-slate-900/90 rounded-2xl border border-slate-800 space-y-2 sm:hidden ${
                mobileTab === 'list' ? 'block' : 'hidden'
              }`}
            >
              <div className="p-2 mb-2 bg-slate-800/80 rounded-xl text-xs text-slate-300 flex items-center justify-between">
                <span>手機專屬星球清單</span>
                <OxygenGauge oxygen={oxygen} deltaAnimation={oxygenDeltaAnim} />
              </div>
              {planets.map((p) => {
                const isCurrent = p.id === playerLocation;
                const canClick = !isCurrent && (p.isEarth || !visitedPlanets.includes(p.id));
                return (
                  <button
                    key={`list-${p.id}`}
                    onClick={() => {
                      if (canClick && !isProcessingMove) {
                        handlePlanetClick(p);
                        setMobileTab('map');
                      }
                    }}
                    disabled={!canClick || isProcessingMove}
                    className={`w-full flex items-center justify-between p-3.5 rounded-xl border text-left transition-all ${
                      isCurrent
                        ? 'bg-yellow-950/50 border-yellow-500/80 text-yellow-200 font-bold'
                        : canClick
                        ? p.isEarth
                          ? 'bg-blue-950/60 border-blue-400 text-white cursor-pointer'
                          : 'bg-slate-800/90 border-slate-700 text-slate-200 cursor-pointer'
                        : 'bg-slate-950/40 border-slate-800/40 text-slate-500 cursor-not-allowed opacity-50'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-full border border-white/20 flex items-center justify-center font-bold text-xs" style={{ backgroundColor: p.isEarth ? '#0284c7' : p.themeColor }}>
                        {p.isEarth ? '🌍' : '🪐'}
                      </div>
                      <div>
                        <div className="font-bold text-sm">{p.name} {p.isEarth && '(地球母星)'}</div>
                        <div className="text-xs text-slate-400">
                          {isCurrent ? '目前所在位置' : p.visited && !p.isEarth ? '已完成調查' : '尚未登陸'}
                        </div>
                      </div>
                    </div>
                    {canClick && <span className="text-xs font-bold text-yellow-300">出發 →</span>}
                  </button>
                );
              })}
            </div>
          </main>

          {/* BOTTOM EVENT LOG & NOTIFICATION PANEL ("說明欄位") */}
          <footer className="w-full bg-slate-900/95 border-t border-slate-800 backdrop-blur-md p-3 sm:p-4 z-20">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-3 sm:gap-4">
              <div className="flex items-center gap-3 w-full md:w-auto justify-center md:justify-start">
                <div className="relative flex-shrink-0 bg-slate-800 rounded-2xl p-1 border border-slate-700">
                  <CuteAstronaut expression={astronautExpression} size="sm" floating={true} />
                </div>
                <div className="md:hidden flex flex-col">
                  <span className="text-xs font-black text-cyan-400">太空人通訊</span>
                  <span className="text-xs text-slate-400">所在：{currentPlanet.name}</span>
                </div>
              </div>

              <div className="flex-1 w-full bg-slate-950/70 border border-slate-800 rounded-2xl p-3 sm:p-4">
                <div className="flex items-center justify-between mb-1">
                  <span className="text-xs font-black text-cyan-400 tracking-wider">即時探測報告與說明欄位</span>
                  <span className="text-xs text-slate-400 font-mono">目前位置: {currentPlanet.name}</span>
                </div>
                <p className="text-sm sm:text-lg font-bold text-slate-100 leading-relaxed">
                  {latestEventMessage}
                </p>
                {eventLogs.length > 0 && (
                  <div className="mt-2 pt-2 border-t border-slate-800/80 flex items-center gap-2 overflow-x-auto text-[11px] text-slate-400">
                    <span className="font-bold flex-shrink-0">近期紀錄:</span>
                    {eventLogs.map((log) => (
                      <span key={log.id} className="px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 whitespace-nowrap">
                        {log.planetName}
                      </span>
                    ))}
                  </div>
                )}
              </div>

              {isMissionGoalAchieved && playerLocation !== 'earth' && (
                <button
                  onClick={() => {
                    const earthPlanet = planets.find((p) => p.isEarth);
                    if (earthPlanet) handlePlanetClick(earthPlanet);
                  }}
                  className="w-full md:w-auto px-6 py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-black text-sm sm:text-base border border-emerald-300 shadow-lg hover:scale-105 active:scale-95 transition-all flex items-center justify-center gap-2 flex-shrink-0 cursor-pointer animate-pulse"
                >
                  <Icon name="checkCircle2" className="w-5 h-5" />
                  <span>立即返航地球</span>
                </button>
              )}
            </div>
          </footer>
        </div>
      );
    };

    // ==========================================
    // 10. VICTORY MODAL COMPONENT
    // ==========================================
    const VictoryModal = ({ mission, oxygenRemaining, exploredCount, onRestart }) => {
      useEffect(() => {
        sounds.playVictory();
        if (window.confetti) {
          try {
            window.confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
            setTimeout(() => {
              window.confetti({ particleCount: 60, angle: 60, spread: 55, origin: { x: 0 } });
              window.confetti({ particleCount: 60, angle: 120, spread: 55, origin: { x: 1 } });
            }, 350);
          } catch (e) {}
        }
      }, []);

      const getMissionCompletionText = () => {
        switch (mission) {
          case 'plant': return '你成功取得了外星植物生命 DNA 樣本！';
          case 'animal': return '你成功取得了外星動物生命 DNA 樣本！';
          case 'explore10': return '你成功探索了十個星球！';
        }
      };

      return (
        <div id="victory-screen" className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
          <div className="anim-modal relative w-full max-w-lg bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900 border-2 border-yellow-400/80 rounded-3xl p-6 sm:p-8 shadow-[0_0_50px_rgba(250,204,21,0.35)] text-center flex flex-col items-center">
            <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-yellow-400/20 border border-yellow-400/60 text-yellow-300 text-sm font-black tracking-wider uppercase mb-3">
              <Icon name="trophy" className="w-4 h-4 text-yellow-400" />
              <span>恭喜過關！</span>
            </div>

            <h2 className="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-300 to-yellow-400 mb-2">
              任務成功！
            </h2>

            <div className="flex items-center gap-2.5 px-5 py-3 rounded-2xl bg-emerald-950/70 border border-emerald-500/50 text-emerald-200 font-black text-base sm:text-lg my-2 shadow-inner">
              <Icon name="checkCircle2" className="w-6 h-6 text-emerald-400 flex-shrink-0" />
              <span>{getMissionCompletionText()}</span>
            </div>

            <p className="text-sm sm:text-base text-cyan-200 font-semibold mb-3">
              你成功在有限的氧氣下完成任務，並活著返回地球母星！
            </p>

            <div className="my-4 relative flex items-center justify-center">
              <CuteAstronaut expression="happy" size="xl" floating={true} />
            </div>

            <div className="w-full grid grid-cols-2 gap-3 mb-5 text-left">
              <div className="p-3 rounded-xl bg-slate-800/80 border border-slate-700">
                <span className="text-xs text-slate-400">剩餘氧氣罐</span>
                <div className="text-lg font-mono font-black text-cyan-300">{oxygenRemaining} 罐</div>
              </div>
              <div className="p-3 rounded-xl bg-slate-800/80 border border-slate-700">
                <span className="text-xs text-slate-400">成功登陸星球</span>
                <div className="text-lg font-mono font-black text-yellow-300">{exploredCount} 顆</div>
              </div>
            </div>

            <button
              onClick={() => { sounds.playClick(); onRestart(); }}
              className="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-yellow-400 via-amber-400 to-yellow-500 text-slate-950 font-black text-lg shadow-lg hover:scale-[1.02] active:scale-[0.98] transition-all cursor-pointer flex items-center justify-center gap-2 border border-yellow-200"
            >
              <Icon name="rotateCcw" className="w-5 h-5 text-slate-950" />
              <span>再玩一次</span>
            </button>
          </div>
        </div>
      );
    };

    // ==========================================
    // 11. GAME OVER MODAL COMPONENT
    // ==========================================
    const GameOverModal = ({ exploredCount, reason, onRestart }) => {
      useEffect(() => {
        sounds.playDefeat();
      }, []);

      return (
        <div id="game-over-screen" className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
          <div className="anim-modal relative w-full max-w-lg bg-gradient-to-b from-slate-900 via-rose-950/40 to-slate-900 border-2 border-rose-500/60 rounded-3xl p-6 sm:p-8 shadow-[0_0_50px_rgba(244,63,94,0.25)] text-center flex flex-col items-center">
            <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-rose-950/80 border border-rose-500/50 text-rose-300 text-sm font-black tracking-wider uppercase mb-3">
              <Icon name="skull" className="w-4 h-4 text-rose-400" />
              <span>任務失敗</span>
            </div>

            <h2 className="text-2xl sm:text-4xl font-black text-rose-200 mb-2">
              氧氣耗盡，太空探險結束了……
            </h2>

            {reason && (
              <p className="text-sm sm:text-base text-rose-300/90 font-medium mb-3 px-2">
                {reason}
              </p>
            )}

            <div className="my-6 relative flex items-center justify-center">
              <CuteAstronaut expression="dizzy" size="xl" floating={true} />
            </div>

            <p className="text-sm sm:text-base font-semibold text-slate-200 mb-5 leading-relaxed">
              太空人的氧氣罐用光了，在太空中無力地緩緩漂浮。
              <br />
              別灰心！吸取這次探索經驗，整裝出發再試一次吧！
            </p>

            <div className="w-full p-3 rounded-xl bg-slate-800/80 border border-slate-700 mb-5 flex justify-between items-center text-left">
              <span className="text-xs sm:text-sm text-slate-400">本次探險星球數</span>
              <span className="text-base sm:text-lg font-mono font-bold text-slate-200">{exploredCount} 顆</span>
            </div>

            <button
              onClick={() => { sounds.playClick(); onRestart(); }}
              className="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-cyan-500 via-sky-500 to-blue-600 text-white font-black text-lg shadow-lg hover:scale-[1.02] active:scale-[0.98] transition-all cursor-pointer flex items-center justify-center gap-2 border border-cyan-300"
            >
              <Icon name="rotateCcw" className="w-5 h-5" />
              <span>重新開始</span>
            </button>
          </div>
        </div>
      );
    };

    // ==========================================
    // 12. ROOT APPLICATION
    // ==========================================
    function App() {
      const [phase, setPhase] = useState('start');
      const [selectedMission, setSelectedMission] = useState(null);
      const [audioEnabled, setAudioEnabled] = useState(true);
      const [finalOxygen, setFinalOxygen] = useState(0);
      const [finalExploredCount, setFinalExploredCount] = useState(0);
      const [gameOverReason, setGameOverReason] = useState('');

      const toggleAudio = () => {
        sounds.enabled = !audioEnabled;
        setAudioEnabled(!audioEnabled);
      };

      const handleStartGame = () => {
        setPhase('mission_select');
      };

      const handleSelectMission = (mission) => {
        setSelectedMission(mission);
        setPhase('playing');
      };

      const handleVictory = (oxygenRemaining, exploredCount) => {
        setFinalOxygen(oxygenRemaining);
        setFinalExploredCount(exploredCount);
        setPhase('victory');
      };

      const handleGameOver = (exploredCount, reason) => {
        setFinalExploredCount(exploredCount);
        setGameOverReason(reason);
        setPhase('game_over');
      };

      const handleRestart = () => {
        setSelectedMission(null);
        setFinalOxygen(0);
        setFinalExploredCount(0);
        setGameOverReason('');
        setPhase('start');
      };

      return (
        <div className="min-h-screen w-full bg-slate-950 text-slate-100 font-sans select-none antialiased">
          {phase === 'start' && (
            <StartScreen onStart={handleStartGame} audioEnabled={audioEnabled} onToggleAudio={toggleAudio} />
          )}

          {phase === 'mission_select' && (
            <MissionSelectScreen
              onSelectMission={handleSelectMission}
              audioEnabled={audioEnabled}
              onToggleAudio={toggleAudio}
              onBack={() => setPhase('start')}
            />
          )}

          {(phase === 'playing' || phase === 'victory' || phase === 'game_over') && selectedMission && (
            <MainGameScreen
              key={selectedMission + (phase === 'start' ? 'reset' : '')}
              mission={selectedMission}
              audioEnabled={audioEnabled}
              onToggleAudio={toggleAudio}
              onRestartGame={handleRestart}
              onVictory={handleVictory}
              onGameOver={handleGameOver}
            />
          )}

          {phase === 'victory' && selectedMission && (
            <VictoryModal
              mission={selectedMission}
              oxygenRemaining={finalOxygen}
              exploredCount={finalExploredCount}
              onRestart={handleRestart}
            />
          )}

          {phase === 'game_over' && (
            <GameOverModal
              exploredCount={finalExploredCount}
              reason={gameOverReason}
              onRestart={handleRestart}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
